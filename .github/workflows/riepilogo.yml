name: Riepilogo mattutino

on:
  schedule:
    # GitHub usa l'orario UTC: 05:30 UTC = 07:30 in Italia (ora legale).
    # In inverno (ora solare) diventa 06:30 italiane; se vuoi mantenere
    # le 07:30 esatte, a ottobre cambia in "30 6 * * *".
    - cron: "30 5 * * *"
  workflow_dispatch: {}   # permette di lanciarlo a mano dal tab Actions per testare

jobs:
  riepilogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Invia riepilogo
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python riepilogo.py
