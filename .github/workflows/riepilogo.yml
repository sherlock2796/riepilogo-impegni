name: Riepilogo mattutino

on:
  # Nessun blocco "schedule": il trigger arriva da cron-job.org,
  # che chiama l'endpoint workflow_dispatch dell'API GitHub alle 7:30.
  workflow_dispatch: {}

jobs:
  riepilogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Invia riepilogo
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python riepilogo.py

      - name: Pubblica dashboard su Netlify
        if: hashFiles('site/index.html') != ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@17 deploy --prod --dir=site \
            --functions=funzioni \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" \
            --message "Riepilogo $(date +%F)"
          echo "--- verifica content-type servito ---"
          URL=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" | jq -r '.ssl_url')
          curl -sI "$URL" | tr -d '\r' | grep -i '^content-type' || true
